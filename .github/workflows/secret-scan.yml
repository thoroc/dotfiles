name: Secret scan

# Runs gitleaks (version pinned in mise.toml) over the commits a push or PR adds,
# and over the whole history on manual runs and weekly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Scan new commits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          base="${BASE:-$BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            range="$HEAD"   # new branch or unknown base: scan everything reachable
          else
            range="$base..$HEAD"
          fi
          gitleaks git --no-banner --redact --verbose --log-opts="$range" .

      - name: Scan full history
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: gitleaks git --no-banner --redact --verbose .
