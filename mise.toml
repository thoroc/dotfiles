[tools]
hk = "latest"
rumdl = "latest"

[hooks]
enter = "mise run --quiet prepare 2>/dev/null || true"

[tasks.init]
description = "Initialise chezmoi (reads ~/.config/chezmoi/init-defaults.toml for answers when present)"
run = "chezmoi init --source ~/.dotfiles"

[tasks.plan]
description = "Preview what chezmoi would change"
run = "chezmoi diff"

[tasks.apply]
description = "Apply chezmoi dotfiles to home directory"
run = "chezmoi apply"

[tasks.format]
description = "Format markdown files"
run = "prettier --write --prose-wrap always '*.md'"

[tasks.lint]
description = "Lint markdown files"
run = "rumdl check ."

[tasks.prepare]
description = "Install git hooks"
run = '''
hk install --quiet
# GUI git clients (VS Code) start with a minimal PATH; make the shim find mise tools
f=.git/hooks/pre-commit
if [ -f "$f" ] && ! grep -q mise/shims "$f"; then
  { head -1 "$f"; echo 'export PATH="$HOME/.local/share/mise/shims:/usr/local/bin:$PATH"'; tail -n +2 "$f"; } > "$f.new" && mv "$f.new" "$f" && chmod +x "$f"
fi
'''
