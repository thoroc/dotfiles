[tools]
hk = "latest"
rumdl = "latest"

[hooks]
enter = "hk install --quiet 2>/dev/null || true"

[tasks.init]
description = "Initialise chezmoi, using ~/.config/chezmoi/init-defaults.toml for answers when present"
run = '''
defaults="${CHEZMOI_INIT_DEFAULTS:-$HOME/.config/chezmoi/init-defaults.toml}"
if [ -f "$defaults" ]; then
  chezmoi init --source ~/.dotfiles --override-data-file "$defaults"
else
  chezmoi init --source ~/.dotfiles
fi
'''

[tasks.plan]
description = "Preview what chezmoi would change"
run = "chezmoi diff"

[tasks.apply]
description = "Apply chezmoi dotfiles to home directory"
run = "chezmoi apply"

[tasks.format]
description = "Format markdown files"
run = "prettier --write --prose-wrap always '*.md'"

[tasks.lint]
description = "Lint markdown files"
run = "rumdl check ."

[tasks.prepare]
description = "Install git hooks"
run = "hk install"
