# Per-machine answers for `chezmoi init` (also `mise run init`).
#
# Copy to ~/.config/chezmoi/init-defaults.toml (outside this repo, so private values stay local) and edit. Keys mirror the
# `[data]` table written to ~/.config/chezmoi/chezmoi.toml. Anything set here is used instead of prompting, and wins over
# an answer already stored in the generated config. Keys left out keep their stored answer or are prompted. Set
# CHEZMOI_INIT_DEFAULTS to read a different file.

[tools]
# "iterm2", "warp", "alacritty", "kitty", "hyper", "wezterm" or "terminal" (built-in, installs nothing)
prompt = "oh-my-posh" # "oh-my-posh" or "none"
ls = "eza"           # "eza", "lsd" or "none"
terminal = "iterm2"
# Editors/IDEs by Homebrew cask name: "visual-studio-code", "zed", "cursor", "vscodium", "sublime-text", "webstorm",
# "intellij-idea", "pycharm"
editors = ["visual-studio-code"]

[tools.ai]
claude = false
gemini = false
codex = false
opencode = false

[tools.notes]
obsidian = false
notion = false
logseq = false
# Only read when the matching tool is true
# obsidian_vault = "/absolute/path/to/vault"
# logseq_graph = "/absolute/path/to/graph"

# [user.work]
# name = "john.doe"
# email = "john.doe@example.com"

# Languages: detected when already installed. Only the Homebrew-to-mise offer needs an answer.
# [lang.golang]
# migrate = false
# [lang.python]
# migrate = false

# Homebrew tools to move to mise ("colima", "d2", "mas"); only ones installed with Homebrew are offered
# [tools]
# migrate_to_mise = []

# Container runtime (exactly one) and local LLM runners (default none; installed apps are detected)
# [tools]
# container = "none"  # "docker", "orbstack", "colima" or "none"
# llm = []            # "ollama", "jan", "msty" and, on Apple Silicon, "lm-studio"

# Linux only: fnox uses age instead of the keychain. Public key (recipient); empty skips the fnox config.
# [secrets]
# age_recipient = "age1..."
# github_token_age = "<age ciphertext of the classic PAT, exported as HOMEBREW_GITHUB_API_TOKEN and MISE_GITHUB_TOKEN>"

# GitHub Apps for fnox github-app leases (short-lived gh tokens), one entry per installation, each with its own app.
# Setup steps: README "GitHub tokens". The ids are not secret; omit an entry to render no lease for it.
# Private keys: macOS keychain (service "fnox", account GITHUB_APP_PRIVATE_KEY for `user`,
# GITHUB_APP_PRIVATE_KEY_<org> for an org); Linux uses key_age.
# [github_app.user]                    # fnox exec -- gh ...
# app_id = "123456"
# installation_id = "11111111"         # https://github.com/settings/installations/<id>
# slug = "<app-slug>"                  # optional: the bot is <app-slug>[bot]
# key_age = "<age ciphertext of the app's PEM private key>"   # Linux only
# [github_app.orgs.<org>]              # fnox -P <org> exec -- gh ...
# app_id = "654321"
# installation_id = "22222222"         # https://github.com/organizations/<org>/settings/installations/<id>
# slug = "<app-slug>"
# key_age = "<age ciphertext>"         # Linux only
